<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Open Sans',sans-serif;font-size:14.5px;background:#ede8e2;min-height:100vh;overscroll-behavior:none;}
.user-bar{width:100%;height:55px;background:#005e54;color:#fff;position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;padding:0 6px 0 4px;max-width:520px;left:50%;transform:translateX(-50%);}
.user-bar .back a{color:#fff;text-decoration:none;display:flex;align-items:center;padding:8px 4px;}
.user-bar .avatar{width:36px;height:36px;margin:0 8px 0 2px;flex-shrink:0;}
.user-bar .avatar img{border-radius:50%;width:100%;height:100%;object-fit:cover;display:block;}
.user-bar .name{flex:1;overflow:hidden;}
.user-bar .name .nameline{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-bar .status{display:block;font-size:13px;font-weight:400;}
.user-bar .actions{display:flex;align-items:center;padding:0 8px;}
.chat-bg{position:fixed;inset:0;background-image:url('https://s3.fr-par.scw.cloud/typebot/public/typebots/cli88mae30010mh0f0yzjqn48/background?v=1685470080750');background-size:initial!important;background-repeat:repeat-x!important;background-color:#ede8e2;z-index:0;}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding-top:65px;padding-bottom:115px;display:flex;flex-direction:column;}
.hoje{position:fixed;z-index:994;text-align:center;width:50px;top:60px;left:calc(50% - 25px);background-color:#ede8e2;margin:0 auto;border-radius:10px;font-size:12px;font-weight:800;box-shadow:0px 1px #c6beb7;pointer-events:none;}
#chat{flex:1;padding:30px 10px 10px;display:flex;flex-direction:column;gap:3px;}
.info-container{display:flex;align-items:center;gap:6px;background-color:#d5f4f0;border-radius:10px;padding:10px;width:fit-content;max-width:450px;margin:.5rem auto 1rem;font-size:14px;}
.info-container p{color:#53676b;margin:0;}
@media(max-width:500px){.info-container{max-width:300px!important;}}
.msg-row{display:flex;align-items:flex-end;gap:6px;margin-bottom:3px;max-width:88%;}
.msg-row.bot{align-self:flex-start;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
.bot-avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;overflow:hidden;align-self:flex-end;}
.bot-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.typebot-host-bubble{position:relative;background:#fff;color:#303235;border-radius:12px 12px 12px 0;padding:8px 12px 22px;max-width:85%;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;line-height:1.45;font-size:14.5px;animation:fadeIn .25s ease;padding-right:12px;}
.typebot-host-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;transform:scaleY(-1);}
.typebot-guest-bubble{position:relative;background:#e1ffc7;color:#303235;border-radius:12px 12px 0 12px;padding:8px 52px 19px 12px;max-width:100%;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;line-height:1.45;font-size:14.5px;animation:fadeIn .25s ease;min-width:70px;}
.typebot-guest-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 0 10px 10px;border-color:transparent transparent transparent #e1ffc7;bottom:0;right:-9px;transform:scaleY(-1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hora, .hora2{position:absolute;bottom:0px;font-size:12px;z-index:995;color:grey;animation:mostrar 2s;}
.hora{right:10px;} .hora2{right:26px;}
@keyframes mostrar{from{opacity:0}to{opacity:1}}
.typing-bubble{background:#fff;border-radius:12px 12px 12px 0;padding:10px 14px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 1px rgba(0,0,0,.13);animation:fadeIn .25s ease;position:relative;}
.typing-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;transform:scaleY(-1);}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:#aaa;animation:bounce .9s infinite;}
.typing-bubble span:nth-child(2){animation-delay:.18s;}
.typing-bubble span:nth-child(3){animation-delay:.36s;}
@keyframes bounce{0%,80%,100%{transform:scale(1);opacity:.5}40%{transform:scale(1.25);opacity:1}}
.check-svg{position:absolute;bottom:3px;right:5px;height:20px;width:18px;}
.img-host{border-radius:8px;overflow:hidden;max-width:260px;box-shadow:0 1px 1px rgba(0,0,0,.13);animation:fadeIn .25s ease;}
.img-host img{width:100%;display:block;}
.audio-host{background:#fff;border-radius:12px 12px 12px 0;padding:8px 12px 6px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 1px rgba(0,0,0,.13);width:265px;max-width:85%;animation:fadeIn .25s ease;position:relative;}
.audio-host::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;transform:scaleY(-1);}
.play-btn{width:36px;height:36px;border-radius:50%;background:#00a884;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;}
.audio-right{flex:1;display:flex;flex-direction:column;gap:2px;}
.audio-bar{height:3px;background:#e0e3e5;border-radius:2px;position:relative;margin:8px 0;}
.audio-fill{position:absolute;height:100%;background:#00a884;width:0%;}
.choices{display:flex;flex-direction:column;gap:8px;margin:6px 0;align-self:flex-end;width:85%;animation:fadeIn .25s ease;}
.choice-btn{background:#128C7E;border:none;border-radius:10px;color:#fff;padding:14px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.18);}
.input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:9999;background:#ede8e2;padding:14px 20px 32px;display:flex;gap:8px;animation:fadeIn .25s ease;}
.input-box{flex:1;height:50px;background:#fff;border:none;border-radius:10px;padding:0 18px;font-size:15px;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.12);}
.send-btn{height:50px;padding:0 26px;border-radius:10px;background:#128C7E;border:none;cursor:pointer;color:#fff;font-weight:600;}
.cards-wrap{align-self:flex-start;margin:4px 0;animation:fadeIn .25s ease;width:100%;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.card-item{border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:2/3;background:#ddd;position:relative;border:2px solid transparent;}
.card-item img{width:100%;height:100%;object-fit:cover;}
.card-item.selected{border-color:#128C7E;}
.cards-submit{background:#128C7E;border:none;border-radius:8px;color:#fff;padding:12px;width:100%;opacity:.4;pointer-events:none;margin-top:4px;}
.cards-submit.ready{opacity:1;pointer-events:all;}
.downBottom{position:fixed;z-index:99998;width:38px;bottom:70px;right:0;color:#29afdf;background-color:#f4f4f7;border-radius:10px 0 0 10px;font-size:20px;font-weight:800;box-shadow:0px 0px 2px 1px #c6beb7;padding:4px;display:none;cursor:pointer;border:none;}
</style>
</head>
<body>
<div class="user-bar">
  <div class="back"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a></div>
  <div class="avatar"><img src="https://minio-production-1fc3.up.railway.app/typebot/public/workspaces/cmfagbg830000ls4iz9r009n3/typebots/x1is357w46fqjn4bsifsvnv5/hostAvatar?v=1777254747316"></div>
  <div class="name">
    <div class="nameline">Serena Mística <svg viewBox="0 0 18 18" height="16" width="16" xmlns="http://www.w3.org/2000/svg"><polygon fill="#00DA60" points="9,16 7.1,16.9 5.8,15.2 3.7,15.1 3.4,13 1.5,12 2.2,9.9 1.1,8.2 2.6,6.7 2.4,4.6 4.5,4 5.3,2 7.4,2.4 9,1.1 10.7,2.4 12.7,2 13.6,4 15.6,4.6 15.5,6.7 17,8.2 15.9,9.9 16.5,12 14.7,13 14.3,15.1 12.2,15.2 10.9,16.9"></polygon><polygon fill="#FFFFFF" points="13.1,7.3 12.2,6.5 8.1,10.6 5.9,8.5 5,9.4 8,12.4"></polygon></svg></div>
    <span class="status" id="statusText">online</span>
  </div>
</div>
<div class="chat-bg"></div>
<div id="app">
  <div class="hoje">Hoje</div>
  <div id="chat">
    <div class="info-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path fill="#4b5e63" fill-rule="evenodd" clip-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM12 17.75C12.4142 17.75 12.75 17.4142 12.75 17V11C12.75 10.5858 12.4142 10.25 12 10.25C11.5858 10.25 11.25 10.5858 11.25 11V17C11.25 17.4142 11.5858 17.75 12 17.75ZM12 7C12.5523 7 13 7.44772 13 8C13 8.55228 12.5523 9 12 9C11.4477 9 11 8.55228 11 8C11 7.44772 11.4477 7 12 7Z"></path></svg>
      <p>Conta comercial</p>
    </div>
  </div>
</div>
<button class="downBottom" id="downBtn">▼</button>
<audio id="notif" src="https://s3.fr-par.scw.cloud/typebot/public/typebots/rx0zcrlqkhifqajxuzr6txa9/blocks/ttfglhs9oks32ebn2ymqcrp1?v=1690899194685"></audio>
<audio id="aud" src="https://minio-production-1fc3.up.railway.app/typebot/public/workspaces/cmfagbg830000ls4iz9r009n3/typebots/x1is357w46fqjn4bsifsvnv5/blocks/d6qa0170lzj5t59k07vxk113?v=1768159136517"></audio>
<script>
const S={NOME:'',NOME_DELE:''};
const chat=document.getElementById('chat');
const statusEl=document.getElementById('statusText');
const AVATAR='https://minio-production-1fc3.up.railway.app/typebot/public/workspaces/cmfagbg830000ls4iz9r009n3/typebots/x1is357w46fqjn4bsifsvnv5/hostAvatar?v=1777254747316';
const delay=ms=>new Promise(r=>setTimeout(r,ms));

function scrollB(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}

async function addBot(txt,ms=1600){
  statusEl.innerText='digitando...';
  await delay(ms);
  statusEl.innerText='online';
  const html=`<div class="msg-row bot">
    <div class="bot-avatar"><img src="${AVATAR}"></div>
    <div class="typebot-host-bubble">${txt.replace(/{{NOME}}/g,S.NOME).replace(/{{NOME DELE}}/g,S.NOME_DELE)}<span class="hora">${new Date().getHours()}:${new Date().getMinutes()}</span></div>
  </div>`;
  chat.insertAdjacentHTML('beforeend',html);
  document.getElementById('notif').play();
  scrollB();
}

async function addImage(src){
  statusEl.innerText='enviando imagem...';
  await delay(1800);
  statusEl.innerText='online';
  const html=`<div class="msg-row bot">
    <div class="bot-avatar"><img src="${AVATAR}"></div>
    <div class="img-host"><img src="${src}"></div>
  </div>`;
  chat.insertAdjacentHTML('beforeend',html);
  scrollB();
}

async function addAudio(){
  statusEl.innerText='gravando áudio...';
  await delay(2500);
  statusEl.innerText='online';
  const html=`<div class="msg-row bot">
    <div class="bot-avatar"><img src="${AVATAR}"></div>
    <div class="audio-host">
      <button class="play-btn" onclick="document.getElementById('aud').play()">▶</button>
      <div class="audio-right"><div class="audio-bar"><div class="audio-fill" id="afill"></div></div></div>
      <span class="hora">0:44</span>
    </div>
  </div>`;
  chat.insertAdjacentHTML('beforeend',html);
  scrollB();
}

function showChoices(opts,cb){
  const div=document.createElement('div');
  div.className='choices';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='choice-btn';
    b.innerText=o;
    b.onclick=()=>{div.remove();addUser(o);cb(o);};
    div.appendChild(b);
  });
  chat.appendChild(div);
  scrollB();
}

function addUser(txt){
  const html=`<div class="msg-row user"><div class="typebot-guest-bubble">${txt}<span class="hora2">${new Date().getHours()}:${new Date().getMinutes()}</span></div></div>`;
  chat.insertAdjacentHTML('beforeend',html);
  scrollB();
}

function showInput(ph,cb){
  const html=`<div class="input-area"><input id="inp" class="input-box" placeholder="${ph}"><button class="send-btn" id="sbtn">Enviar</button></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  document.getElementById('sbtn').onclick=()=>{
    const v=document.getElementById('inp').value;
    if(v){document.querySelector('.input-area').remove();addUser(v);cb(v);}
  };
}

function showCards(cb){
  const wrap=document.createElement('div'); wrap.className='cards-wrap';
  const grid=document.createElement('div'); grid.className='cards-grid';
  const sub=document.createElement('button'); sub.className='cards-submit'; sub.innerText='Escolher 3 cartas';
  let sel=[];
  for(let i=1;i<=6;i++){
    const c=document.createElement('div'); c.className='card-item';
    c.innerHTML=`<img src="https://minio-production-1fc3.up.railway.app/typebot/public/workspaces/cmfagbg830000ls4iz9r009n3/typebots/x1is357w46fqjn4bsifsvnv5/blocks/unroy3or3n8bqjt7zj1ejrep/items/sz8hqzatumn38xjn404ihe9d?v=1768160326120">`;
    c.onclick=()=>{
      if(sel.includes(i)){ sel=sel.filter(x=>x!=i); c.classList.remove('selected'); }
      else if(sel.length<3){ sel.push(i); c.classList.add('selected'); }
      if(sel.length==3){ sub.classList.add('ready'); sub.innerText='Revelar leitura'; }
    };
    grid.appendChild(c);
  }
  sub.onclick=()=>{ if(sel.length==3){wrap.remove();cb();} };
  wrap.appendChild(grid); wrap.appendChild(sub); chat.appendChild(wrap); scrollB();
}

async function flow(){
  await addBot("Sua leitura está começando. Respire fundo.");
  await delay(2000);
  await addBot("Olá... estou me conectando com a sua vibração agora...");
  await addBot("Sinto uma energia de angústia vindo de você.");
  await addBot("Você pensou em alguém que mudou o comportamento com você da noite para o dia?");
  showChoices(["Sim, é exatamente assim"], async()=>{
    await addBot("Entendi. Isso é um sinal clássico de interferência.");
    await addBot("Me diga seu nome completo para eu rastrear sua energia.");
    showInput("Seu nome...", async(v)=>{
      S.NOME=v.split(' ')[0];
      await addBot("Vou escrever seu nome para colocar na mesa...");
      await addImage("https://img1.niftyimages.com/6wjh/5glp/_o2f?name="+S.NOME);
      await addBot("Agora, digite o nome completo dele (ou dela).");
      showInput("Nome dele...", async(v2)=>{
        S.NOME_DELE=v2.split(' ')[0];
        await addBot("As cartas não mentem. Escolha 3 cartas abaixo.");
        showCards(async()=>{
          await addBot("Interessante... e preocupante.");
          await addImage("https://img1.niftyimages.com/6wjh/repp/ep3f?name="+S.NOME+"&nome_dele="+S.NOME_DELE);
          await addBot("{{NOME}}, a conexão entre vocês é um laço de almas, porém...");
          await addBot("A carta que saiu no meio bloqueando o caminho é o **DIABO**.");
          await addBot("Isso revela uma energia densa e manipuladora agindo sobre a cabeça de {{NOME DELE}} agora.");
          
          // --- INJEÇÃO DE PROVA SOCIAL ---
          await addBot("{{NOME}}, eu sei que parece pesado ouvir isso... mas você não está sozinha.");
          await addBot("Quero te mostrar o que aconteceu com outras pessoas que também viram o 'Diabo' na mesa e decidiram abrir o Raio-X para descobrir a verdade:");
          
          await addImage("https://leiturahoje.site/wp-content/uploads/2026/07/IMG_1435.png"); // Print Cláudia
          await addImage("https://leiturahoje.site/wp-content/uploads/2026/07/IMG_1437.png"); // Print Letícia
          // -------------------------------

          await addBot("Eu gravei um áudio rápido explicando essa terceira energia:");
          await addAudio();
          await delay(5000);
          await addBot("Você quer saber EXATAMENTE quem é esse 'Diabo' que está atrapalhando vocês?");
          showChoices(["Sim, eu preciso salvar essa relação"], async()=>{
             await addBot("No Raio-X eu revelo a identidade de quem atrapalha e o pensamento secreto dele.");
             await addBot("Tudo isso por apenas **R$ 35,00**.");
             await addBot("Você recebe tudo no seu WhatsApp após o pagamento.");
             chat.insertAdjacentHTML('beforeend','<button class="choice-btn" style="width:100%" onclick="location.href=\'https://pay.kirvano.com/792b5ada-2456-41d0-95ed-5341fcc9049d\'">ACESSAR O RAIO-X DO VÍNCULO OCULTO</button>');
             scrollB();
          });
        });
      });
    });
  });
}
flow();
</script>
</body>
</html>
