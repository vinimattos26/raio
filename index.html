#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding-top:65px;padding-bottom:115px;display:flex;flex-direction:column;}
.hoje{position:fixed;z-index:994;text-align:center;width:50px;top:60px;left:calc(50% - 25px);background-color:#ede8e2;margin:0 auto;border-radius:10px;font-size:12px;font-weight:800;box-shadow:0px 1px #c6beb7;pointer-events:none;}
#chat{flex:1;padding:30px 10px 10px;display:flex;flex-direction:column;gap:3px;}
.info-container{display:flex;align-items:center;gap:6px;background-color:#d5f4f0;border-radius:10px;padding:10px;width:fit-content;max-width:450px;margin:.5rem auto 1rem;font-size:14px;}
.info-container p{color:#53676b;margin:0;}
@media(max-width:500px){.info-container{max-width:300px!important;}}
.msg-row{display:flex;align-items:flex-end;gap:6px;margin-bottom:3px;max-width:88%;}
.msg-row.bot{align-self:flex-start;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
.bot-avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;overflow:hidden;align-self:flex-end;}
.bot-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
/* === CSS EXATO DO TEMA TYPEBOT === */
.typebot-host-bubble{will-change:transform,opacity;position:relative;background:#fff;color:#303235;border-radius:12px 12px 12px 0;padding:8px 12px 22px;max-width:85%;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;line-height:1.45;font-size:14.5px;animation:fadeIn .25s ease;padding-right:12px;}
.typebot-host-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;-webkit-transform:scaleY(-1);-moz-transform:scaleY(-1);-o-transform:scaleY(-1);transform:scaleY(-1);}
.typebot-guest-bubble{will-change:transform,opacity;position:relative;background:#e1ffc7;color:#303235;border-radius:12px 12px 0 12px;padding:8px 52px 19px 12px;max-width:100%;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;line-height:1.45;font-size:14.5px;animation:fadeIn .25s ease;min-width:70px;}
.typebot-guest-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 0 10px 10px;border-color:transparent transparent transparent #e1ffc7;bottom:0;right:-9px;-webkit-transform:scaleY(-1);-moz-transform:scaleY(-1);-o-transform:scaleY(-1);transform:scaleY(-1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hora{position:absolute;bottom:0px;right:10px;font-size:12px;z-index:995;color:grey;animation-name:mostrar;animation-duration:2s;}
.hora2{position:absolute;bottom:0px;right:26px;font-size:12px;z-index:995;color:grey;animation-name:mostrar;animation-duration:2s;}
@keyframes mostrar{from{opacity:0}to{opacity:1}}
.text-fade-in{transition:opacity .4s ease-in .2s;margin-bottom:20px;}
.m-2{margin:8px;margin-bottom:16px;}
.my-2{margin-top:8px;}
#checkIcon{stroke-dasharray:40;stroke-dashoffset:40;z-index:99;}
#checkIcon path:nth-child(1){animation:showIcon 250ms ease forwards;animation-delay:500ms;}
#checkIcon path:nth-child(2){animation:showIcon 250ms ease forwards;animation-delay:400ms;}
@keyframes showIcon{to{stroke-dashoffset:0}}
.typing-bubble{will-change:transform,opacity;background:#fff;border-radius:12px 12px 12px 0;padding:10px 14px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 1px rgba(0,0,0,.13);animation:fadeIn .25s ease;position:relative;}
.typing-bubble::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;-webkit-transform:scaleY(-1);-moz-transform:scaleY(-1);-o-transform:scaleY(-1);transform:scaleY(-1);}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:#aaa;animation:bounce .9s infinite;}
.typing-bubble span:nth-child(2){animation-delay:.18s;}
.typing-bubble span:nth-child(3){animation-delay:.36s;}
@keyframes bounce{0%,80%,100%{transform:scale(1);opacity:.5}40%{transform:scale(1.25);opacity:1}}
.check-svg{position:absolute;bottom:3px;right:5px;height:20px;width:18px;}
.img-host{border-radius:8px;overflow:hidden;max-width:260px;box-shadow:0 1px 1px rgba(0,0,0,.13);animation:fadeIn .25s ease;}
.img-host img{width:100%;display:block;}
.audio-host{background:#fff;border-radius:12px 12px 12px 0;padding:8px 12px 6px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 1px rgba(0,0,0,.13);width:265px;max-width:85%;animation:fadeIn .25s ease;position:relative;}
.audio-host::after{position:absolute;content:"";width:0;height:0;border-style:solid;border-width:0px 10px 10px 0;border-color:transparent #fff transparent transparent;bottom:0;left:-9px;transform:scaleY(-1);}
.play-btn{width:36px;height:36px;border-radius:50%;background:#00a884;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;padding:0;transition:background .15s;}
.play-btn:hover{background:#008a6e;}
.play-btn svg{width:18px;height:18px;display:block;fill:#fff;}
.audio-right{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:2px;}
.audio-bar{height:3px;background:#e0e3e5;border-radius:2px;cursor:pointer;position:relative;margin:8px 6px 4px 0;}
.audio-fill{position:absolute;height:100%;background:#9faab1;border-radius:2px;width:0%;top:0;left:0;pointer-events:none;}
.audio-thumb{position:absolute;width:13px;height:13px;border-radius:50%;background:#00a884;top:50%;left:0;transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.18);pointer-events:none;}
.audio-bottom{display:flex;align-items:center;gap:6px;}
.audio-mic{width:18px;height:18px;flex-shrink:0;fill:#00a884;}
.audio-time{font-size:11px;color:#667781;}
.cards-wrap{align-self:flex-start;margin:4px 0;animation:fadeIn .25s ease;max-width:90vw;width:100%;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.card-item{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .2s;aspect-ratio:2/3;background:#ddd;position:relative;}
.card-item img{width:100%;height:100%;object-fit:cover;display:block;}
.card-item.selected{border-color:#128C7E;box-shadow:0 0 0 2px #128C7E;}
.card-check{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:#128C7E;display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;}
.card-item.selected .card-check{display:flex;}
.cards-hint{font-size:13px;color:#555;margin-bottom:8px;text-align:center;}
.cards-ctr{font-size:12px;color:#888;text-align:center;margin-bottom:8px;}
.choices{display:flex;flex-direction:column;gap:8px;margin:6px 0;align-self:flex-end;align-items:flex-end;max-width:85%;animation:fadeIn .25s ease;}
.choice-btn{background:#128C7E;border:none;border-radius:10px;color:#fff;padding:14px 22px;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:background .2s;box-shadow:0 1px 2px rgba(0,0,0,.18);}
.choice-btn:hover{background:#0e7066;}
.choice-pulse{width:11px;height:11px;border-radius:50%;background:#25D366;margin:0 16px 4px 0;align-self:flex-end;box-shadow:0 0 0 0 rgba(37,211,102,.7);animation:choicePulse 1.8s ease-in-out infinite;}
@keyframes choicePulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7);opacity:1;transform:scale(1);}70%{box-shadow:0 0 0 10px rgba(37,211,102,0);opacity:.6;transform:scale(.9);}100%{box-shadow:0 0 0 0 rgba(37,211,102,0);opacity:1;transform:scale(1);}}
.input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:9999;background:#ede8e2;padding:14px 20px 32px;display:flex;gap:8px;align-items:center;animation:fadeIn .25s ease;}
.input-box{flex:1;height:50px;background:#fff;border:none;border-radius:10px;padding:0 18px;font-family:'Open Sans',sans-serif;font-size:15px;color:#303235;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.12);}
.input-box::placeholder{color:#8a8a8a;}
.send-btn{height:50px;padding:0 26px;border-radius:10px;background:#128C7E;border:none;cursor:pointer;color:#fff;font-family:'Open Sans',sans-serif;font-size:15px;font-weight:600;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:background .2s;}
.send-btn:hover{background:#0e7066;}
.cards-submit{background:#128C7E;border:none;border-radius:8px;color:#fff;padding:12px 16px;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;width:100%;opacity:.4;pointer-events:none;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.2);margin-top:4px;}
.cards-submit.ready{opacity:1;pointer-events:all;}
.downBottom{position:fixed;z-index:99998;width:38px;bottom:70px;right:0;color:#29afdf;background-color:#f4f4f7;border-radius:10px 0 0 10px;font-size:20px;font-weight:800;box-shadow:0px 0px 2px 1px #c6beb7;padding:4px 4px 6px;display:none;cursor:pointer;border:none;line-height:1;align-items:center;justify-content:center;}
</style>

// Preload card images early
function preloadCards(){CARD_URLS.forEach(u=>{const i=new Image();i.src=u;});}
// Preload audio when cards shown
function preloadAudio(){document.getElementById('aud').load();}
function scrollBottom(force){setTimeout(()=>{const dist=document.body.scrollHeight-window.scrollY-window.innerHeight;if(force||dist<200){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}},60);}
window.addEventListener('scroll',()=>{const p=(window.scrollY/(document.body.scrollHeight-window.innerHeight))*100;downBtn.style.display=p<=88?'flex':'none';},{passive:true});
downBtn.addEventListener('click',()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}));
function nowTime(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function rTxt(t){return t.replace(/\{\{NOME\}\}/g,S.NOME||'você').replace(/\{\{NOME DELE\}\}/g,S.NOME_DELE||'essa pessoa');}
const delay=ms=>new Promise(r=>setTimeout(r,ms));

let typingEl=null;
function showTyping(){removeTyping();statusEl.innerText='digitando...';const row=document.createElement('div');row.className='msg-row bot';const av=document.createElement('div');av.className='bot-avatar';av.innerHTML='<img src="'+AVATAR+'" alt="">';const b=document.createElement('div');b.className='typing-bubble';b.innerHTML='<span></span><span></span><span></span>';row.appendChild(av);row.appendChild(b);chat.appendChild(row);typingEl=row;scrollBottom();}
function removeTyping(){if(typingEl){typingEl.remove();typingEl=null;}statusEl.innerText='online';}

function addBot(html,ms){return new Promise(async r=>{showTyping();await delay(ms||1600);removeTyping();const row=document.createElement('div');row.className='msg-row bot';const av=document.createElement('div');av.className='bot-avatar';av.innerHTML='<img src="'+AVATAR+'" alt="">';const b=document.createElement('div');b.className='typebot-host-bubble';b.innerHTML=rTxt(html)+'<span class="hora">'+nowTime()+'</span>';row.appendChild(av);row.appendChild(b);chat.appendChild(row);notif.play().catch(()=>{});scrollBottom();await delay(250);r();});}
function addUser(txt){const row=document.createElement('div');row.className='msg-row user';const b=document.createElement('div');b.className='typebot-guest-bubble';b.innerHTML=txt+'<span class="hora2">'+nowTime()+'</span><svg id="checkIcon" class="check-svg" viewBox="0 0 38.626 24.684" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-708.9 -601.383)"><path d="M728.035,623.468l1.382,1.482,17.929-20.334" transform="translate(-1.937 -1.117)" fill="none" stroke="#29afdf" stroke-linecap="round" stroke-width="3"></path><path d="M712.017,616.07l7.088,8.039,17.757-20.14" transform="translate(-1 -0.469)" fill="none" stroke="#29afdf" stroke-linecap="round" stroke-width="3"></path></g></svg>';row.appendChild(b);chat.appendChild(row);scrollBottom(true);}
function px(e){if(typeof fbq!=='undefined')fbq('trackCustom',e);}

let inputEl=null;
function removeInput(){if(inputEl){inputEl.remove();inputEl=null;}}
function showInput(ph,tp,cb){removeInput();const div=document.createElement('div');div.className='input-area';const inp=document.createElement('input');inp.type=tp||'text';inp.className='input-box';inp.placeholder=ph;inp.autocomplete=tp==='email'?'email':'off';if(tp==='email')inp.inputMode='email';const btn=document.createElement('button');btn.className='send-btn';btn.textContent='Enviar';const go=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}if(tp==='email'&&!v.includes('@')){inp.style.outline='2px solid #e74c3c';inp.focus();return;}removeInput();cb(v);};btn.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});div.appendChild(inp);div.appendChild(btn);document.body.appendChild(div);inputEl=div;setTimeout(()=>inp.focus(),100);}

function showChoices(opts){return new Promise(resolve=>{const div=document.createElement('div');div.className='choices';const pulse=document.createElement('div');pulse.className='choice-pulse';div.appendChild(pulse);opts.forEach(o=>{const b=document.createElement('button');b.className='choice-btn';b.textContent=o.label;b.addEventListener('click',()=>{div.remove();resolve(o);});div.appendChild(b);});chat.appendChild(div);scrollBottom();});}

function addImage(src){return new Promise(async r=>{showTyping();await delay(1800);removeTyping();const row=document.createElement('div');row.className='msg-row bot';const av=document.createElement('div');av.className='bot-avatar';av.innerHTML='<img src="'+AVATAR+'" alt="">';const iw=document.createElement('div');iw.className='img-host';const img=document.createElement('img');img.src=rTxt(src);img.alt='';iw.appendChild(img);row.appendChild(av);row.appendChild(iw);chat.appendChild(row);notif.play().catch(()=>{});scrollBottom();await delay(300);r();});}

function addAudioPlayer(){statusEl.innerText='gravando áudio...';return new Promise(async r=>{await delay(1200);statusEl.innerText='online';const row=document.createElement('div');row.className='msg-row bot';const av=document.createElement('div');av.className='bot-avatar';av.innerHTML='<img src="'+AVATAR+'" alt="">';const PLAY_SVG='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>';const PAUSE_SVG='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';const MIC_SVG='<svg class="audio-mic" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>';const pl=document.createElement('div');pl.className='audio-host';pl.innerHTML='<button class="play-btn" id="pb" aria-label="Play">'+PLAY_SVG+'</button><div class="audio-right"><div class="audio-bar" id="ab"><div class="audio-fill" id="af"></div><div class="audio-thumb" id="ath"></div></div><div class="audio-bottom">'+MIC_SVG+'<span class="audio-time" id="at">0:00</span></div></div><span class="hora">'+nowTime()+'</span>';row.appendChild(av);row.appendChild(pl);chat.appendChild(row);notif.play().catch(()=>{});scrollBottom();const audio=document.getElementById('aud');const pb=pl.querySelector('#pb');const fill=pl.querySelector('#af');const thumb=pl.querySelector('#ath');const tEl=pl.querySelector('#at');const bar=pl.querySelector('#ab');pb.addEventListener('click',()=>{if(audio.paused){audio.play();pb.innerHTML=PAUSE_SVG;pb.setAttribute('aria-label','Pause');}else{audio.pause();pb.innerHTML=PLAY_SVG;pb.setAttribute('aria-label','Play');}});audio.addEventListener('timeupdate',()=>{const p=audio.duration?(audio.currentTime/audio.duration*100):0;fill.style.width=p+'%';thumb.style.left=p+'%';const m=Math.floor(audio.currentTime/60);const s=String(Math.floor(audio.currentTime%60)).padStart(2,'0');tEl.textContent=m+':'+s;});audio.addEventListener('ended',()=>{pb.innerHTML=PLAY_SVG;pb.setAttribute('aria-label','Play');});bar.addEventListener('click',(e)=>{if(!audio.duration)return;const rect=bar.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));audio.currentTime=audio.duration*pct;});await delay(300);r();});}

function showCards(){return new Promise(resolve=>{const wrap=document.createElement('div');wrap.className='cards-wrap';const hint=document.createElement('div');hint.className='cards-hint';hint.textContent='Toque nas cartas para selecionar';const grid=document.createElement('div');grid.className='cards-grid';const ctr=document.createElement('div');ctr.className='cards-ctr';ctr.textContent='0 de 3 cartas selecionadas';const sub=document.createElement('button');sub.className='cards-submit';sub.textContent='Revelar minha leitura \u2192';const sel=new Set();CARD_URLS.forEach((url,i)=>{const c=document.createElement('div');c.className='card-item';c.innerHTML='<img src="'+url+'" alt="Carta '+(i+1)+'" loading="lazy" decoding="async"><div class="card-check">\u2713</div>';c.addEventListener('click',()=>{if(sel.has(i)){sel.delete(i);c.classList.remove('selected');}else if(sel.size<3){sel.add(i);c.classList.add('selected');}ctr.textContent=sel.size+' de 3 cartas selecionadas';if(sel.size===3){sub.classList.add('ready');}else{sub.classList.remove('ready');}});grid.appendChild(c);});sub.addEventListener('click',()=>{if(!sub.classList.contains('ready'))return;wrap.remove();resolve();});wrap.appendChild(hint);wrap.appendChild(grid);wrap.appendChild(ctr);wrap.appendChild(sub);chat.appendChild(wrap);scrollBottom();});}
